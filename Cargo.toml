[package]
name = "waxy"
version = "0.1.0"
edition = "2021"

[lib]
name = "_waxy"
crate-type = ["cdylib"]

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
rustc-hash = "2.1.3"
taffy = "0.15"

[profile.release]
lto = "fat"
codegen-units = 1
# Don't add `panic = "abort"`: InvalidNodeId and the panic-to-TaffyException conversion rely on
# catch_unwind, which can't catch anything when panics abort.
